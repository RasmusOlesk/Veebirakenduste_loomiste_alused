<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box shadow</title>
    <style>
        p {
            width: 100px;
            height: px;
            background-color: #e1ddda;
            margin: 20px;
            display: inline-block;
        }
        p.one {
            box-shadow: 10px 10px 5px #ffffff;
            width: 100px;
            height: 100px;
            background-color: #cecccc;
            margin: 20px;
            display: inline-block;
        }
        p.two {
            box-shadow: 5px 5px 5px #616161;
            width: 100px;
            height: 100px;
            background-color: #cecccc;
            margin: 20px;
            display: inline-block;
        }
        p.three {
            box-shadow: 10px 10px 5px #616161;
            width: 100px;
            height: 100px;
            background-color: #cecccc;
            margin: 20px;
            display: inline-block;
        }
        p.four {
            box-shadow: 0px 0px 10px #616161;
            width: 100px;
            height: 100px;
            background-color: #cecccc;
            margin: 20px;
            display: inline-block;
        }
        p.five {
            box-shadow: inset 0px 0px 10px #777777;
            width: 100px;
            height: 100px;
            background-color: #cecccc;
            margin: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <p class="one"></p>
    <p class="two"></p>
    <p class="three"></p>
    <br />
    <p class="four"></p>
    <p class="five"></p>
</body>
</html>
